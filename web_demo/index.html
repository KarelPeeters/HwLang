<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>HWLang demo</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #ffffff;
            --foreground: #000000;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #282c34;
                --foreground: #abb2bf;
            }

            .icon-mono {
                filter: invert(1);
            }
        }

        body {
            background-color: var(--background);
            color: var(--foreground);
        }
    </style>
</head>
<body>

<div style="display: flex">
    <div style="width: 50%">
        <a href="https://github.com/KarelPeeters/HwLang"><img alt="GitHub repository" class="icon-mono" src="res/github-mark.svg"
                                                              width="20px"></a>
        <a href="." id="button-share"><img alt="Share current source code" class="icon-mono" src="res/share.svg" width="20px"></a>
        <img alt="Clear current source code" class="icon-mono" id="button-clear" src="res/garbage-bin.svg" style="cursor: pointer"
             width="20px">

        <div id="div-editor-input"></div>
    </div>
    <div style="width: 50%">
        <img alt="Show lowered Verilog" class="icon-mono" id="svg-verilog" src="res/logo-verilog.svg"
             style="cursor: pointer"
             width="20px">
        <img alt="Show lowered C++" id="svg-cpp" src="res/logo-cpp.svg"
             style="cursor: pointer"
             width="20px">
        <img alt="Show format debug info" class="icon-mono" id="svg-format" src="res/logo-format.svg"
             style="cursor: pointer"
             width="20px">
        <img alt="Show IR debug info" class="icon-mono" id="svg-ir" src="res/logo-ir.svg"
             style="cursor: pointer"
             width="20px">

        <div id="div-diags-compile" style="font-family: monospace, monospace; white-space: nowrap;"></div>
        <div id="div-editor-output-verilog"></div>

        <div id="div-editor-output-cpp" style="display: none"></div>

        <div id="div-diags-format" style="font-family: monospace, monospace; white-space: nowrap; display: none"></div>
        <div id="div-editor-output-format" style="display: none"></div>

        <div id="div-editor-output-ir" style="display: none"></div>
    </div>
</div>

<noscript>This page contains webassembly and javascript content, please enable javascript in your browser.</noscript>
<script src="./bootstrap.js"></script>
</body>
</html>
