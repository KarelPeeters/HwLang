[project]
name = "hwl"
version = "0.1.0"

requires-python = ">=3.12,<3.15"

[build-system]
requires = ["maturin>=1.11"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
profile = "dev"

[tool.uv]
cache-keys = [
    { file = "../**/*.toml" },
    { file = "../**/*.rs" },
    { file = "../**/*.kh" },
    { file = "../**/*.lalrpop" },
    { file = "../**/*.pyi" },
    { file = "../hwl_language/src/back/verilog_keywords.txt" },
    { file = "../hwl_language/src/back/verilator_template.cpp" },
]
